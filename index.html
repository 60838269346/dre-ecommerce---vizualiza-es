<script>
    const BIN_ID = "6a60f751da38895dfe805e30";
    const API_KEY = "$2a$10$2gRuysiXM85zMZ4OTG2dU.AEaN0WyPHJveZ2wy62/tqidY73EOJBS";
    const mesesNomes = {
        "01": "Janeiro", "02": "Fevereiro", "03": "Março", "04": "Abril", 
        "05": "Maio", "06": "Junho", "07": "Julho", "08": "Agosto", 
        "09": "Setembro", "10": "Outubro", "11": "Novembro", "12": "Dezembro"
    };
    const canais = [
        { id: "1) IFOOD", nome: "1) IFOOD" },
        { id: "2) APP/SITE", nome: "2) APP/SITE" },
        { id: "3) MARKETPLACE", nome: "3) MARKETPLACE" },
        { id: "CONSOLIDADO", nome: "CONSOLIDADO (TOTAL)" },
        { id: "CONSOLIDADO_LADO_A_LADO", nome: "📊 CONSOLIDADO LADO A LADO" }
    ];
    let canalAtivo = "1) IFOOD";
    let anoAtivo = "2026";
    let lancamentos = [];
    let adminAutenticado = false; // Controle de sessão da senha
    let editandoIndex = null;     // Controle se estamos editando um lançamento existente

    async function carregarDadosDaNuvem() {
        try {
            let resposta = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            if (resposta.ok) {
                let resultado = await resposta.json();
                if (resultado.record && Array.isArray(resultado.record.lancamentos)) {
                    lancamentos = resultado.record.lancamentos;
                }
            }
        } catch (e) {
            console.error("Erro ao carregar da nuvem, usando dados vazios.", e);
        }
        renderizarBotoesCanais();
        calcularEAtualizarDRE();
    }

    async function salvarDadosNaNuvem() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ lancamentos: lancamentos })
            });
        } catch (e) {
            console.error("Erro ao salvar na nuvem.", e);
        }
    }

    function tentarAbrirAdmin() {
        if (adminAutenticado) {
            toggleAdminModal();
            return;
        }
        let senha = prompt("Acesso restrito. Digite a senha para realizar o lançamento:");
        if (senha === "0") {
            adminAutenticado = true;
            toggleAdminModal();
        } else if (senha !== null) {
            alert("Senha incorreta! Apenas você pode realizar lançamentos.");
        }
    }

    function formatarMoeda(valor, isTotalizador = false) {
        let absVal = Math.abs(valor);
        let formatado = absVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        let textoFinal = valor < 0 ? `(${formatado})` : formatado;
        if (isTotalizador) {
            return `<span class="font-bold">${textoFinal}</span>`;
        }
        return `<span class="font-medium">${textoFinal}</span>`;
    }

    function formatarPercentual(valor, isTotalizador = false) {
        let formatado = valor.toFixed(2).replace('.', ',') + '%';
        return isTotalizador ? `<span class="font-bold">${formatado}</span>` : formatado;
    }

    function renderizarBotoesCanais() {
        const container = document.getElementById('canais-botoes');
        container.innerHTML = '';
        canais.forEach(c => {
            let btn = document.createElement('button');
            let isActive = c.id === canalAtivo;
            btn.className = `px-4 py-2.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center space-x-2 ${isActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`;
            btn.innerHTML = `<span>${c.nome}</span>`;
            btn.onclick = () => {
                canalAtivo = c.id;
                renderizarBotoesCanais();
                calcularEAtualizarDRE();
            };
            container.appendChild(btn);
        });
    }

    function atualizarAnoFiltro() {
        anoAtivo = document.getElementById('filtro-ano').value;
        calcularEAtualizarDRE();
    }

    function toggleAdminModal() {
        const modal = document.getElementById('admin-modal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            cancelarEdicao(); // Limpa estado ao abrir
            renderizarLancamentosRecentes();
        }
    }

    async function adicionarLancamento() {
        const mes = document.getElementById('lanc-mes').value;
        const ano = document.getElementById('lanc-ano').value;
        const canal = document.getElementById('lanc-canal').value;
        const tipo = document.getElementById('lanc-tipo').value;
        let valorStr = document.getElementById('lanc-valor').value.trim().replace(',', '.');
        let valor = parseFloat(valorStr);
        const desc = document.getElementById('lanc-desc').value || "Lançamento DRE";

        if (isNaN(valor) || valor <= 0) {
            alert('Por favor, informe um valor numérico válido.');
            return;
        }

        const novoItem = {
            canal: String(canal).trim(),
            tipo: String(tipo).trim(),
            valor: Number(valor),
            desc,
            mes: String(mes),
            ano: String(ano)
        };

        if (editandoIndex !== null) {
            // Atualiza item existente
            lancamentos[editandoIndex] = novoItem;
            editandoIndex = null;
        } else {
            // Adiciona novo item
            lancamentos.push(novoItem);
        }

        await salvarDadosNaNuvem();
        
        // Limpar apenas valores e descrição para facilitar múltiplos lançamentos seguidos
        document.getElementById('lanc-valor').value = '';
        document.getElementById('lanc-desc').value = '';
        
        document.getElementById('filtro-ano').value = ano;
        anoAtivo = String(ano);
        canalAtivo = String(canal);
        
        renderizarBotoesCanais();
        calcularEAtualizarDRE();
        renderizarLancamentosRecentes();
    }

    function editarLancamento(index) {
        const l = lancamentos[index];
        if (!l) return;

        document.getElementById('lanc-mes').value = l.mes;
        document.getElementById('lanc-ano').value = l.ano;
        document.getElementById('lanc-canal').value = l.canal;
        document.getElementById('lanc-tipo').value = l.tipo;
        document.getElementById('lanc-valor').value = l.valor;
        document.getElementById('lanc-desc').value = l.desc;
        
        editandoIndex = index;
        
        // Altera visualmente o botão para indicar edição
        const btnSalvar = document.querySelector('button[onclick="adicionarLancamento()"]');
        btnSalvar.innerText = "Atualizar Lançamento";
        btnSalvar.className = "px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700 shadow-sm";
    }

    function cancelarEdicao() {
        editandoIndex = null;
        document.getElementById('lanc-valor').value = '';
        document.getElementById('lanc-desc').value = '';
        const btnSalvar = document.querySelector('button[onclick="adicionarLancamento()"]');
        if (btnSalvar) {
            btnSalvar.innerText = "Salvar Lançamento";
            btnSalvar.className = "px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 shadow-sm";
        }
    }

    async function removerLancamento(index) {
        if (confirm("Deseja realmente excluir este lançamento?")) {
            lancamentos.splice(index, 1);
            await salvarDadosNaNuvem();
            renderizarLancamentosRecentes();
            calcularEAtualizarDRE();
        }
    }

    function renderizarLancamentosRecentes() {
        const container = document.getElementById('lista-lancamentos-recentes');
        container.innerHTML = '';

        if (lancamentos.length === 0) {
            container.innerHTML = '<p class="text-slate-400">Nenhum lançamento registrado.</p>';
            return;
        }

        // Agrupar lançamentos por Ano e Mês
        let agrupados = {};
        lancamentos.forEach((l, idx) => {
            let chaveAno = l.ano || "2026";
            let chaveMes = l.mes || "01";
            if (!agrupados[chaveAno]) agrupados[chaveAno] = {};
            if (!agrupados[chaveAno][chaveMes]) agrupados[chaveAno][chaveMes] = [];
            agrupados[chaveAno][chaveMes].push({ ...l, originalIndex: idx });
        });

        // Renderizar organizadamente por Ano e Mês
        Object.keys(agrupados).sort().reverse().forEach(ano => {
            Object.keys(agrupados[ano]).sort().forEach(mes => {
                let divMes = document.createElement('div');
                divMes.className = 'mb-3';
                
                let tituloMes = document.createElement('div');
                tituloMes.className = 'font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded text-xs mb-1';
                tituloMes.innerText = `${mesesNomes[mes]} / ${ano}`;
                divMes.appendChild(tituloMes);

                agrupados[ano][mes].forEach(l => {
                    let canalObj = canais.find(c => c.id === l.canal);
                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'flex justify-between items-center bg-white p-2 rounded border border-slate-200 mb-1';
                    itemDiv.innerHTML = `
                        <span class="truncate pr-2"><strong>${canalObj?.nome || l.canal}</strong> - ${l.tipo} (${l.desc}): ${formatarMoeda(l.valor)}</span>
                        <div class="flex space-x-2 shrink-0">
                            <button onclick="editarLancamento(${l.originalIndex})" class="text-blue-500 hover:text-blue-700" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="removerLancamento(${l.originalIndex})" class="text-red-500 hover:text-red-700" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>`;
                    divMes.appendChild(itemDiv);
                });

                container.appendChild(divMes);
            });
        });
    }

    function calcularDadosCanalParaAno(nomeCanal, ano) {
        let mesesAtivos = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
        let lancsCanalAno = [];
        if (nomeCanal === "CONSOLIDADO") {
            lancsCanalAno = lancamentos.filter(l => l.ano === ano);
        } else {
            lancsCanalAno = lancamentos.filter(l => l.canal === nomeCanal && l.ano === ano);
        }

        let dadosMes = {};
        mesesAtivos.forEach(mes => {
            dadosMes[mes] = {
                receita_bruta: 0, impostos: 0, receita_liquida: 0,
                cmv: 0, lucro_bruto: 0, pessoal: 0, comercial: 0,
                fretes: 0, administrativas: 0, tributarias: 0,
                outras_despesas: 0, total_desp: 0, ebitda: 0
            };
        });

        lancsCanalAno.forEach(l => {
            let m = l.mes || "01";
            let t = l.tipo;
            if (dadosMes[m] && dadosMes[m][t] !== undefined) {
                dadosMes[m][t] += Number(l.valor);
            }
        });

        Object.keys(dadosMes).forEach(m => {
            let dm = dadosMes[m];
            dm.receita_liquida = dm.receita_bruta - dm.impostos;
            dm.lucro_bruto = dm.receita_liquida - dm.cmv;
            dm.total_desp = dm.pessoal + dm.comercial + dm.fretes + dm.administrativas + dm.tributarias + dm.outras_despesas;
            dm.ebitda = dm.lucro_bruto - dm.total_desp;
        });

        let acumuladoAno = {
            receita_bruta: 0, impostos: 0, receita_liquida: 0,
            cmv: 0, lucro_bruto: 0, pessoal: 0, comercial: 0,
            fretes: 0, administrativas: 0, tributarias: 0,
            outras_despesas: 0, total_desp: 0, ebitda: 0
        };

        Object.values(dadosMes).forEach(dm => {
            Object.keys(acumuladoAno).forEach(k => {
                acumuladoAno[k] += dm[k];
            });
        });

        return { dadosMes, acumuladoAno };
    }

    function calcularEAtualizarDRE() {
        const objCanalAtivo = canais.find(c => c.id === canalAtivo) || canais[0];
        document.getElementById('titulo-dre-canal').innerText = `DRE Detalhada - ${objCanalAtivo.nome} (${anoAtivo})`;
        
        const badgeContainer = document.getElementById('badge-av-container');
        if (canalAtivo === "CONSOLIDADO") {
            badgeContainer.innerText = "Base A.V.: Receita Líquida Consolidada (100%)";
        } else if (canalAtivo === "CONSOLIDADO_LADO_A_LADO") {
            badgeContainer.innerText = "Visão Lado a Lado: IFOOD | APP/SITE | MARKETPLACE | CONSOLIDADO (Com A.V. individual)";
        } else {
            badgeContainer.innerText = "Base A.V.: Receita Líquida do Canal (100%)";
        }

        const theadTr = document.getElementById('dre-thead-tr');
        const tbody = document.getElementById('dre-table-body');
        tbody.innerHTML = '';

        if (canalAtivo === "CONSOLIDADO_LADO_A_LADO") {
            let theadHtml = '<th class="py-3 px-4 min-w-[240px] coluna-fixa bg-slate-100">Estrutura da DRE</th>';
            const canaisComparacao = ["1) IFOOD", "2) APP/SITE", "3) MARKETPLACE", "CONSOLIDADO"];
            const rotulosCurtos = {
                "1) IFOOD": "IFOOD",
                "2) APP/SITE": "APP/SITE",
                "3) MARKETPLACE": "MARKETPLACE",
                "CONSOLIDADO": "TOTAL GERAL"
            };

            canaisComparacao.forEach(idC => {
                theadHtml += `<th class="py-3 px-2 text-right border-l border-slate-300 font-bold bg-slate-100">${rotulosCurtos[idC]} (Acum.)</th>`;
                theadHtml += `<th class="py-3 px-2 text-right font-bold bg-slate-100">A.V.</th>`;
            });
            theadTr.innerHTML = theadHtml;

            let dadosCanais = {};
            canaisComparacao.forEach(idC => {
                dadosCanais[idC] = calcularDadosCanalParaAno(idC, anoAtivo).acumuladoAno;
            });

            function adicionarLinhaLadoALado(nome, seletorValor, isHeader = false, isSubtotal = false, forcarParenteses = false) {
                let tr = document.createElement('tr');
                if (isHeader) tr.className = 'bg-slate-100 font-bold text-slate-900';
                else if (isSubtotal) tr.className = 'bg-slate-50 font-semibold text-slate-800 border-t border-b border-slate-200';
                else tr.className = 'hover:bg-slate-50/80 transition';

                let html = `<td class="px-4 py-2.5 coluna-fixa">${nome}</td>`;
                canaisComparacao.forEach(idC => {
                    let acumuladoAno = dadosCanais[idC];
                    let valAcum = seletorValor(acumuladoAno);
                    let baseAcumAV = acumuladoAno.receita_liquida !== 0 ? acumuladoAno.receita_liquida : 1;
                    let avAcum = (valAcum / baseAcumAV) * 100;
                    let valAcumExibicao = forcarParenteses && valAcum > 0 ? -valAcum : valAcum;

                    html += `
                        <td class="py-2.5 px-2 text-right border-l border-slate-200">${formatarMoeda(valAcumExibicao, isHeader || isSubtotal)}</td>
                        <td class="py-2.5 px-2 text-right text-slate-500">${formatarPercentual(avAcum, isHeader || isSubtotal)}</td>
                    `;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            }

            adicionarLinhaLadoALado("Receita Bruta Total", dm => dm.receita_bruta, true, false);
            adicionarLinhaLadoALado("(-) Impostos sobre Vendas", dm => dm.impostos, false, false, true);
            adicionarLinhaLadoALado("(=) Receita Líquida", dm => dm.receita_liquida, false, true);
            adicionarLinhaLadoALado("(-) Custo das Mercadorias Vendidas (CMV)", dm => dm.cmv, true, false, true);
            adicionarLinhaLadoALado("(=) Lucro Bruto", dm => dm.lucro_bruto, false, true);
            adicionarLinhaLadoALado("(-) Despesas Operacionais (SG&A Totais)", dm => dm.total_desp, true, false, true);
            adicionarLinhaLadoALado("    • Gastos com Pessoal", dm => dm.pessoal, false, false, true);
            adicionarLinhaLadoALado("    • Despesas Comerciais / Embalagens", dm => dm.comercial, false, false, true);
            adicionarLinhaLadoALado("    • Fretes / Entrega Cliente", dm => dm.fretes, false, false, true);
            adicionarLinhaLadoALado("    • Despesas Administrativas", dm => dm.administrativas, false, false, true);
            adicionarLinhaLadoALado("    • Despesas Tributárias", dm => dm.tributarias, false, false, true);
            adicionarLinhaLadoALado("    • Outras Despesas Operacionais", dm => dm.outras_despesas, false, false, true);
            adicionarLinhaLadoALado("(=) EBITDA / Resultado Operacional", dm => dm.ebitda, false, true);
            return;
        }

        let resCanal = calcularDadosCanalParaAno(canalAtivo, anoAtivo);
        let dadosMes = resCanal.dadosMes;
        let acumuladoAno = resCanal.acumuladoAno;
        let mesesAtivos = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];

        let theadHtml = '<th class="py-3 px-4 min-w-[240px] coluna-fixa bg-slate-100">Estrutura da DRE</th>';
        mesesAtivos.forEach(mes => {
            theadHtml += `<th class="py-3 px-2 text-right">${mesesNomes[mes].substring(0,3)}</th><th class="py-3 px-2 text-right">A.V.</th>`;
        });
        theadHtml += `<th class="py-3 px-3 text-right bg-slate-200/60">Acumulado (${anoAtivo})</th><th class="py-3 px-3 text-right bg-slate-200/60">A.V. Acum.</th>`;
        theadTr.innerHTML = theadHtml;

        function adicionarLinha(nome, seletorValor, isHeader = false, isSubtotal = false, forcarParenteses = false) {
            let tr = document.createElement('tr');
            if (isHeader) tr.className = 'bg-slate-100 font-bold text-slate-900';
            else if (isSubtotal) tr.className = 'bg-slate-50 font-semibold text-slate-800 border-t border-b border-slate-200';
            else tr.className = 'hover:bg-slate-50/80 transition';

            let html = `<td class="px-4 py-2.5 coluna-fixa">${nome}</td>`;
            mesesAtivos.forEach(mes => {
                let dm = dadosMes[mes];
                let val = seletorValor(dm);
                let baseAV = dm.receita_liquida !== 0 ? dm.receita_liquida : 1;
                let av = (val / baseAV) * 100;
                let valExibicao = forcarParenteses && val > 0 ? -val : val;

                html += `
                    <td class="py-2.5 px-2 text-right">${formatarMoeda(valExibicao, isHeader || isSubtotal)}</td>
                    <td class="py-2.5 px-2 text-right text-slate-500">${formatarPercentual(av, isHeader || isSubtotal)}</td>
                `;
            });

            let valAcum = seletorValor(acumuladoAno);
            let baseAcumAV = acumuladoAno.receita_liquida !== 0 ? acumuladoAno.receita_liquida : 1;
            let avAcum = (valAcum / baseAcumAV) * 100;
            let valAcumExibicao = forcarParenteses && valAcum > 0 ? -valAcum : valAcum;

            html += `
                <td class="py-2.5 px-3 text-right bg-slate-50">${formatarMoeda(valAcumExibicao, true)}</td>
                <td class="py-2.5 px-3 text-right text-slate-600 bg-slate-50">${formatarPercentual(avAcum, true)}</td>
            `;
            tr.innerHTML = html;
            tbody.appendChild(tr);
        }

        adicionarLinha("Receita Bruta Total", dm => dm.receita_bruta, true, false);
        adicionarLinha("(-) Impostos sobre Vendas", dm => dm.impostos, false, false, true);
        adicionarLinha("(=) Receita Líquida", dm => dm.receita_liquida, false, true);
        adicionarLinha("(-) Custo das Mercadorias Vendidas (CMV)", dm => dm.cmv, true, false, true);
        adicionarLinha("(=) Lucro Bruto", dm => dm.lucro_bruto, false, true);
        adicionarLinha("(-) Despesas Operacionais (SG&A Totais)", dm => dm.total_desp, true, false, true);
        adicionarLinha("    • Gastos com Pessoal", dm => dm.pessoal, false, false, true);
        adicionarLinha("    • Despesas Comerciais / Embalagens", dm => dm.comercial, false, false, true);
        adicionarLinha("    • Fretes / Entrega Cliente", dm => dm.fretes, false, false, true);
        adicionarLinha("    • Despesas Administrativas", dm => dm.administrativas, false, false, true);
        adicionarLinha("    • Despesas Tributárias", dm => dm.tributarias, false, false, true);
        adicionarLinha("    • Outras Despesas Operacionais", dm => dm.outras_despesas, false, false, true);
        adicionarLinha("(=) EBITDA / Resultado Operacional", dm => dm.ebitda, false, true);
    }

    function exportarPDF() {
        window.print();
    }

    function exportarExcel() {
        const tabela = document.getElementById("tabela-dre-dados");
        let csv = [];
        for (let i = 0; i < tabela.rows.length; i++) {
            let row = [], cols = tabela.rows[i].querySelectorAll("th, td");
            for (let j = 0; j < cols.length; j++) {
                let texto = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").replace(/;/g, ",");
                row.push('"' + texto + '"');
            }
            csv.push(row.join(";"));
        }
        let csvFile = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
        let downloadLink = document.createElement("a");
        downloadLink.download = `DRE_${canalAtivo}_${anoAtivo}.csv`;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    // Inicializar buscando os dados na nuvem
    carregarDadosDaNuvem();
</script>
